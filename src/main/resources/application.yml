spring:
  application:
    name: ai-agent
  ai:
    dashscope:
      api-key: ${API-KEY}
      chat:
        options:
          model: qwen-plus
    ollama:
      enabled: false
      base-url: http://localhost:11434
      chat:
      model: gemma3:1b

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi ??????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.fox.aiagent.controller
# knife4j ?????
knife4j:
  enable: true
  setting:
    language: zh_cn
